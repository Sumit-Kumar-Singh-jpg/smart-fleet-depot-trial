<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet Admin</title><link rel="stylesheet" href="src/css/worker.css"><link rel="stylesheet" href="src/css/legacy-extra.css"><script defer src="src/js/i18n.js"></script><script defer src="src/js/remote.js"></script><script defer src="src/js/mobile-admin.js"></script><script defer src="src/js/legacy-ui.js"></script></head><body data-ui="legacy"><main><h1>Fleet Admin</h1><p id="admin-status" role="status" aria-live="polite"></p><section class="panel"><h2>Staff accounts</h2><div id="users"></div></section><section class="panel"><h2>Create or update staff account</h2><form id="user-form"><label for="username">User ID</label><input id="username" required pattern="[a-z0-9_-]{3,60}" autocomplete="off"><label for="new-password">Password</label><input id="new-password" type="password" minlength="10" required autocomplete="new-password"><label for="account-role">Work role</label><select id="account-role"><option value="entry">Bus entry</option><option value="cleaner">Cleaning</option><option value="charging">Charging</option><option value="scheduler">Scheduler</option><option value="manager">Depot manager</option><option value="admin">Fleet Admin</option></select><label for="account-depot">Depot</label><select id="account-depot"></select><button type="submit" class="primary" style="margin-top:16px">Save</button></form></section><button id="admin-signout">Sign out</button></main></body></html>
