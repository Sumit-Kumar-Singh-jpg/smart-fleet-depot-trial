<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F7F5F0"><title>Smart Fleet OS - Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg-base:#F7F5F0;--bg-surface:#FFFFFF;--text-primary:#34454C;--text-secondary:#7B8688;--border-subtle:#0093A5;--brand-primary:#D96629;--bg:#F7F5F0;--surface:#fff;--ink:#34454C;--muted:#7B8688;--teal:#0093A5;--orange:#D96629;--ok:#059669;--bad:#DC2626;--line:rgba(0,147,165,.17);--shadow:0 8px 28px rgba(38,57,60,.08);font-family:Inter,"Segoe UI",Arial,sans-serif}body.dark{color-scheme:dark;--bg-base:#111314;--bg-surface:#1E272B;--text-primary:#F0F2F2;--text-secondary:#A2B0AD;--border-subtle:#2DB7C9;--brand-primary:#E57338;--bg:#111314;--surface:#1E272B;--ink:#F0F2F2;--muted:#A2B0AD;--teal:#2DB7C9;--orange:#E57338;--ok:#81C784;--bad:#EF7777;--line:rgba(45,183,201,.22);--shadow:0 8px 28px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;min-height:100vh}.app{min-height:100vh;display:flex;flex-direction:column}.top{min-height:70px;padding:10px 24px;display:flex;align-items:center;gap:16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:10px;min-width:190px;font-weight:700}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--orange);color:#fff}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:3px}.act{white-space:nowrap;border:0;border-radius:9px;padding:10px 11px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}.right{display:flex;align-items:center;gap:7px}.state{font-size:11px;font-weight:700;white-space:nowrap;padding:7px 10px;border-radius:99px;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.state.off{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}.act{border:1px solid var(--line);color:var(--ink);background:var(--surface)}main{flex:1;display:flex;flex-direction:column;min-height:0}.welcome{padding:20px 24px 12px}.welcome h1{font-size:21px;margin:0 0 5px;letter-spacing:-.02em}.welcome p{margin:0;font-size:13px;color:var(--muted)}.framebox{flex:1;min-height:480px;margin:0 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}iframe{width:100%;height:calc(100vh - 165px);min-height:480px;border:0;background:var(--bg);display:block}.login,.gate{width:min(450px,calc(100% - 28px));margin:auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.login h1,.gate h2{font-size:24px;margin:0 0 8px}.login p,.gate p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px}.login label,.gate label{display:block;font-size:13px;font-weight:600;margin:14px 0 7px}.login input,.gate input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}.login input:focus,.gate input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 16%,transparent)}.password-field{position:relative}.password-field input{padding-right:72px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;border-radius:7px;padding:7px 9px;background:transparent;color:var(--muted);font:600 12px Inter,Arial,sans-serif;cursor:pointer}.password-toggle:hover{background:var(--bg)}.password-toggle:focus-visible{outline:2px solid var(--teal);outline-offset:2px}.primary{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer}.error{min-height:18px;margin-top:8px;font-size:13px;color:var(--bad)}.hint{font-size:11px!important;margin:16px 0 0!important}.layer{position:fixed;inset:0;z-index:9;background:#09121480;display:grid;place-items:center;padding:15px}.gate{margin:0}.gatehead{display:flex;justify-content:space-between;gap:10px}.close{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.footer{padding:0 24px 9px;color:var(--muted);font-size:11px}@media(max-width:980px){.top{padding:9px 13px;gap:8px;flex-wrap:wrap}.brand{flex:1;min-width:0}.welcome{padding:16px 14px 10px}.framebox{margin:0 8px 10px}iframe{height:calc(100vh - 190px)}}@media(max-width:580px){.brand{font-size:13px}.mark{width:34px;height:34px}.state{display:none}.framebox,iframe{min-height:420px}.login,.gate{padding:22px}}

.welcome{padding:24px clamp(16px,4vw,40px) 18px}.welcome h1{font-size:clamp(25px,3vw,34px);margin:0 0 7px;letter-spacing:-.035em}.welcome p{font-size:14px;line-height:1.55}</style><link rel="stylesheet" href="src/css/mobile.css"><script defer src="src/js/i18n.js"></script><script defer src="src/js/remote.js"></script></head><body><div class="app"><header class="top"><div class="brand"><span class="mark">SF</span><span>Smart Fleet OS<small>TRANSIT OPERATIONS</small></span></div><div class="right"><span class="state off" id="state">Signed out</span><button class="act" id="theme" type="button">◐ Theme</button></div></header><main id="main"></main><footer class="footer">Fleet operations workspace</footer></div>
<script>
(function(){'use strict';if(self!==top){top.postMessage({type:'sfr:logout'},location.origin);document.body.innerHTML='';return;}
const requestedApp=window.FleetAndroid?.role()||new URL(location.href).searchParams.get('app')||'';
const mods=[{id:'entry',label:'Entry Recorder',title:'Gate intake',desc:'Record depot entry, scan number plates, and forward buses.',file:'entry_recorder.html'},{id:'cleaner',label:'Cleaner Hub',title:'Bay inspection',desc:'Manage wash bays, inspections, and cleaning approvals.',file:'cleaner.html'},{id:'charging',label:'Charging Incharge',title:'Charging operations',desc:'Track charger bays, state of charge, and approvals.',file:'charging.html'},{id:'scheduler',label:'Scheduler Console',title:'Ready pool and dispatch',desc:'Recommend eligible buses and drivers, then assign service schedules.',file:'scheduler.html'},{id:'manager',label:'Depot Manager',title:'Depot manager',desc:'Review depot work and reported problems.',file:'manager.html'},{id:'admin',label:'Admin / Multi-Depot',title:'Multi-depot operations',desc:'Manage depots, shared buses, transfers, fleet search, and audit activity.',file:'admin.html',u:'admin',p:'admin123'}];
const $=id=>document.getElementById(id),main=$('main'),state=$('state'),frame=document.createElement('iframe');frame.title='Fleet operations console';frame.allow='camera';frame.setAttribute('allowfullscreen','');let auth=null,active='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function credential(u,p,target){u=u.trim().toLowerCase();const fixed=mods.find(x=>x.u===u&&x.p===p);if(fixed&&(!target||fixed.id===target))return{id:fixed.id,u,p,admin:fixed.id==='admin'};try{const db=JSON.parse(localStorage.getItem('sfos_multi_v2')||'null'),roleMap={entry:'entry',clean:'cleaner',charge:'charging',sched:'scheduler',mgr:'manager'};for(const d of(db&&db.depots)||[]){const users=d.users||{};for(const [key,r] of Object.entries(users)){if(!r||String(r.u||'').trim().toLowerCase()!==u)continue;if(String(r.p??'')!==p)continue;const suffix=u.slice(u.lastIndexOf('-')+1),id=roleMap[key]||({entry:'entry',clean:'cleaner',charge:'charging',sched:'scheduler',mgr:'manager'}[suffix]);if(id&&(!target||id===target))return{id,u,p,admin:false,depot:d.id};}}}catch(_e){}return null;}
function login(error){auth=null;sessionStorage.removeItem('fleet_session');sessionStorage.removeItem('auth_token');sessionStorage.removeItem('auth_role');active='';state.textContent='Signed out';state.classList.add('off');main.innerHTML='<section class="login"><h1>Welcome to Smart Fleet</h1><p>Sign in to open your work screen.</p><form id="loginForm"><label for="user">User ID</label><input id="user" autocomplete="username" required><label for="pass">Password</label><div class="password-field"><input id="pass" type="password" autocomplete="current-password" required><button class="password-toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><div class="error" id="err" role="alert">'+esc(error||'')+'</div><button class="primary">Sign in</button></form></section>'; $('togglePassword').addEventListener('click',()=>{const input=$('pass'),button=$('togglePassword'),show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Hide':'Show';button.setAttribute('aria-label',show?'Hide password':'Show password');button.setAttribute('aria-pressed',String(show));}); $('loginForm').addEventListener('submit',async e=>{e.preventDefault();let a;try{if(window.FleetRemote?.enabled){a=await FleetRemote.login($('user').value,$('pass').value,requestedApp);}else if(window.FleetRemote?.required){throw new Error('Configure the depot server to sign in.');}else{a=credential($('user').value,$('pass').value,requestedApp||undefined);}}catch(error){$('err').textContent=error.message;return;}if(!a){$('err').textContent='Invalid user ID or password. Depot accounts must use the current password in Admin → Depot Logins.';return;}auth=a;open(a.id);});}
function open(id){
 if(!auth||auth.id!==id)return;
 const m=mods.find(x=>x.id===id);if(!m)return;
 const depot=auth.depot||'chandapura';
 sessionStorage.setItem('fleet_session',JSON.stringify({id:auth.id,u:auth.u,depot}));
 if(id==='scheduler'){
  sessionStorage.setItem('auth_token',btoa('scheduler:'+Date.now()+':secure_salt_mock'));
  sessionStorage.setItem('auth_role','scheduler');
 }
 const file=id==='admin'&&window.FleetRemote?.enabled?'mobile_admin.html':m.file;
 location.assign(file+(auth.depot?'?depotId='+encodeURIComponent(auth.depot):''));
}
$('theme').onclick=()=>{const dark=!document.body.classList.contains('dark');document.body.classList.toggle('dark',dark);localStorage.setItem('fleet_theme',dark?'dark':'light');try{frame.contentDocument.body.classList.toggle('dark-mode',dark);frame.contentDocument.documentElement.dataset.theme=dark?'dark':'light';}catch(_e){}};
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data)return;if(e.data.type==='sfr:logout')login('You have signed out.');if(e.data.type==='sfr:theme'){const dark=e.data.value==='dark';document.body.classList.toggle('dark',dark);localStorage.setItem('fleet_theme',dark?'dark':'light');}});window.addEventListener('storage',e=>{if(e.key==='fleet_theme'&&e.newValue){const dark=e.newValue==='dark';document.body.classList.toggle('dark',dark);try{frame.contentDocument.body.classList.toggle('dark-mode',dark);frame.contentDocument.documentElement.dataset.theme=dark?'dark':'light';}catch(_e){}}});if(localStorage.getItem('fleet_theme')==='dark')document.body.classList.add('dark');login('');if(requestedApp){const role=mods.find(m=>m.id===requestedApp);if(role){main.querySelector('h1').textContent=role.label;document.title=role.label+' · Smart Fleet';}}})();
</script></body></html>
