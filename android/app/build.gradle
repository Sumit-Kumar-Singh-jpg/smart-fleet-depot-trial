plugins { id 'com.android.application' }
android {
    namespace 'in.smartfleet.depot'
    compileSdk 36
    defaultConfig { applicationId 'in.smartfleet.depot'; minSdk 26; targetSdk 36; versionCode 4; versionName '1.2.0'; resValue 'string', 'app_name', 'Smart Fleet OS'; buildConfigField 'String', 'WORK_ROLE', '""'; buildConfigField 'String', 'SERVER_URL', '"https://smart-fleet-depot-trial.onrender.com"' }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    sourceSets.main.assets.srcDirs = ['../../dist']
}
