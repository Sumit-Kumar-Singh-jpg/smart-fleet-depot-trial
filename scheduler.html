<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fleet OS - Scheduler Console</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Local app data & database scripts -->
    <script src="src/data/app_data.js"></script>
    <script src="src/js/database.js"></script>
    <style>
        :root {
            --bg-base: #F7F5F0;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #F8F6F2;
            --border-subtle: #0093A5;
            --border-card: rgba(30, 147, 165, 0.1);
            --text-bright: #34454C;
            --text-primary: #34454C;
            --text-secondary: #7B8688;
            --text-muted: #7B8688;
            --brand-primary: #D96629;
            --status-safe: #059669;
            --status-error: #DC2626;
            --font-sans: "Inter", sans-serif;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

            --tag-cat-a-bg: #E3F2FD;
            --tag-cat-a-fg: #1976D2;
            --tag-cat-b-bg: #E8F5E9;
            --tag-cat-b-fg: #388E3C;
            --tag-cat-c-bg: #FFFDE7;
            --tag-cat-c-fg: #F9A825;
        }

        body.dark-mode {
            --bg-base: #111314;
            --bg-surface: #1E272B;
            --bg-card: #1E272B;
            --bg-card-subtle: #263238;
            --border-subtle: #2DB7C9;
            --border-card: rgba(45, 183, 201, 0.2);
            --text-bright: #F0F2F2;
            --text-primary: #F0F2F2;
            --text-secondary: #A2B0AD;
            --text-muted: #A2B0AD;
            --brand-primary: #E57338;
            --status-safe: #81C784;
            --status-error: #E57373;

            --tag-cat-a-bg: rgba(25, 118, 210, 0.2);
            --tag-cat-a-fg: #90CAF9;
            --tag-cat-b-bg: rgba(56, 142, 60, 0.2);
            --tag-cat-b-fg: #A5D6A7;
            --tag-cat-c-bg: rgba(249, 168, 37, 0.2);
            --tag-cat-c-fg: #FFE082;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--tag-cat-c-bg);
            color: var(--tag-cat-c-fg);
        }

        body.dark-mode .badge {
            background: rgba(245, 158, 11, 0.2);
            color: #FCD34D;
        }

        .theme-toggle {
            background-color: var(--bg-card-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 500;
            width: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--text-bright);
            margin: 0;
            margin-bottom: 0.5rem;
            font-size: 2.25rem;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 1.125rem;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-bright);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-bright);
        }

        input[type="text"],
        input[type="password"],
        select,
        input[type="time"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
            color: var(--text-primary);
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--brand-primary);
            color: #FFFFFF;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        body.dark-mode button {
            color: #0F172A;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .logout-btn {
            background-color: #64748B;
            margin-top: 1rem;
            color: #FFFFFF;
        }

        body.dark-mode .logout-btn {
            background-color: var(--bg-card-subtle);
            color: var(--text-primary);
        }

        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.success {
            background-color: rgba(5, 150, 105, 0.1);
            color: var(--status-safe);
            border: 1px solid var(--status-safe);
            display: block;
        }

        .alert.error {
            background-color: rgba(220, 38, 38, 0.1);
            color: var(--status-error);
            border: 1px solid var(--status-error);
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        /* Stats tags */
        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--bg-card-subtle);
            color: var(--text-secondary);
        }

        .tag.cat-a {
            background: var(--tag-cat-a-bg);
            color: var(--tag-cat-a-fg);
        }

        .tag.cat-b {
            background: var(--tag-cat-b-bg);
            color: var(--tag-cat-b-fg);
        }

        .tag.cat-c {
            background: var(--tag-cat-c-bg);
            color: var(--tag-cat-c-fg);
        }

        /* Auto-assignment result box */
        #auto-assignment-result {
            margin-bottom: 1.25rem;
            padding: 1rem;
            background-color: var(--bg-card-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            display: none;
        }

        /* Disabled state styling */
        button[disabled]:hover {
            opacity: 0.5;
        }
    </style>
<style>*,*::before,*::after{box-sizing:border-box}button,select{min-height:52px}body{font-size:17px}.container{max-width:900px}.card{padding:24px}#scheduler-depot-label{font-size:20px;font-weight:700}@media(max-width:540px){.container{padding:12px}.card{padding:16px}#scheduler-view>div[style*="display: flex"]{flex-direction:column}h1{font-size:28px}}</style><link rel="stylesheet" href="src/css/mobile.css"><script defer src="src/js/i18n.js"></script><script defer src="src/js/remote.js"></script></head>

<body>

    <div class="container">
        <div class="header-top">
            <span class="badge">Scheduler</span>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">☀️ Light</button>
        </div>

        <div class="header">
            <h1>Smart Fleet OS</h1>
            <p id="scheduler-depot-label">Route & Driver Assignment</p>
        </div>



        <!-- Scheduler View -->
        <div id="scheduler-view" class="card view-section">
            <h2>Scheduler Console</h2>
            <p style="color:var(--text-secondary)">Route & Driver Assignment.</p>
            <div class="form-group"
                style="padding-bottom:1rem; border-bottom:1px solid var(--border-subtle); margin-bottom:1.5rem;">
                <p><strong>Available Buses in Ready Pool:</strong> <span id="pool-count" class="tag">0</span></p>
            </div>

            <div id="scheduler-alert" class="alert" role="status" aria-live="polite" tabindex="-1"></div>

            <div class="form-group">
                <label for="scheduler-route-select">1. Choose trip</label>
                <select id="scheduler-route-select" onchange="onScheduleSelected()"></select>
            </div>

            <!-- Auto-Assignment Proposed Review Box -->
            <div id="auto-assignment-result"
                style="margin-bottom: 1.25rem; padding: 1.25rem; background-color: var(--bg-card-subtle); border: 1px solid var(--border-subtle); border-radius: 8px; display: none;">
                <!-- Proposed assignment & reasoning displayed here -->
            </div>

            <div class="form-group">
                <label for="scheduler-bus-select">2. Choose bus</label>
                <select id="scheduler-bus-select" onchange="onManualResourceChanged()"></select>
            </div>

            <div class="form-group">
                <label for="scheduler-driver-select">3. Choose driver</label>
                <select id="scheduler-driver-select" onchange="onManualResourceChanged()"></select>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
                <button id="final-assign-btn" onclick="finalizeAssignment()" style="flex:1;" disabled>Assign bus and driver</button>
                <button class="logout-btn" onclick="schedulerLogout()" style="width: auto;">Logout</button>
            </div>

        </div>
    </div>

    <script>
            const ACTIVE_DEPOT_ID=new URLSearchParams(location.search).get('depotId')||'chandapura';
        function activeDepotName(){try{const state=JSON.parse(localStorage.getItem('sfos_multi_v2')||'null'),depot=(state?.depots||[]).find(item=>item.id===ACTIVE_DEPOT_ID);if(depot?.name)return depot.name;}catch(e){}return ACTIVE_DEPOT_ID==='chandapura'?'Chandapura Depot 44':ACTIVE_DEPOT_ID.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+' Depot';}
        function showActiveDepotDescription(text){const subtitle=document.querySelector('.subtitle');if(subtitle)subtitle.textContent=text;}

        // --- THEME MANAGEMENT ---
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-btn');
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                btn.innerText = '☀️ Light';
                localStorage.setItem('fleet_theme', 'light');
            } else {
                body.classList.add('dark-mode');
                btn.innerText = '🌙 Dark';
                localStorage.setItem('fleet_theme', 'dark');
            }
        }

        if (localStorage.getItem('fleet_theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-btn').innerText = '🌙 Dark';
        }

        // --- SECURITY & UTILITIES ---
        // Security: Basic input sanitization to prevent XSS
        function sanitizeInput(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Security: Mocking session tokens (scheduler-specific)
        function generateMockToken(role) {
            return btoa(role + ':' + Date.now() + ':secure_salt_mock');
        }

        function verifySession() {
            const token = sessionStorage.getItem('auth_token');
            const role = sessionStorage.getItem('auth_role');
            if (!token || !role) return null;
            try {
                const decoded = atob(token);
                if (decoded.startsWith(role + ':')) {
                    return role;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // Authorization Guard - Scheduler only
        function requireSchedulerRole() {
            const role = verifySession();
            if (!role || role !== 'scheduler') {
                schedulerLogout();
                throw new Error("Unauthorized Access - Scheduler role required");
            }
            return role;
        }

        // --- STATE MANAGEMENT ---
        window.onload = function () {
            // Safe access to globals
            window.FLEET = typeof FLEET !== 'undefined' ? FLEET : [];
            window.SCHEDULES = typeof SCHEDULES !== 'undefined' ? SCHEDULES : [];
            window.ROUTES = typeof ROUTES !== 'undefined' ? ROUTES : [];

            let localWorkflowState = {};
            try {
                let item = localStorage.getItem('fleet_workflow_state');
                if (item) {
                    let parsed = JSON.parse(item);
                    if (typeof parsed === 'object' && parsed !== null) {
                        localWorkflowState = parsed;
                    }
                }
            } catch (e) {
                console.warn("Could not parse state from localStorage.");
            }

            function saveState() {
                localStorage.setItem('fleet_workflow_state', JSON.stringify(localWorkflowState));
            }

            // Initialize state for all buses
            window.FLEET.forEach(bus => {
                if (!localWorkflowState[bus.id]) {
                    localWorkflowState[bus.id] = {
                        chargeApproved: false,
                        cleanApproved: false,
                        scheduleAssigned: null,
                        assignedDriver: null
                    };
                }
            });
            saveState();

            window.getMergedFleet = function () {
                return window.FLEET.map(bus => {
                    return {
                        ...bus,                           // Base fleet data
                        ...localWorkflowState[bus.id]     // Workflow state overlay
                    };
                });
            };

            // --- NAVIGATION ---
            window.showView = function (viewId) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                clearAlerts();
            };

            function clearAlerts() {
                document.querySelectorAll('.alert').forEach(el => {
                    el.className = 'alert';
                    el.innerText = '';
                });
            }

            window.showAlert = function (viewPrefix, type, msg) {
                const el = document.getElementById(viewPrefix + '-alert');
                // Safe assignment using sanitize
                el.innerHTML = sanitizeInput(msg);
                el.className = 'alert ' + type;
            };

            // Check if there is an active session on load
            const activeRole = verifySession();
            if (activeRole === 'scheduler') {
                loadSchedulerView();
                showView('scheduler-view');
            } else {
                // Redirect to main login if not authenticated
                window.location.href = window.FleetRemote?.loginURL()||'index.html';
            }

            // --- AUTHENTICATION ---
            window.schedulerLogout = async function () {
                await window.FleetRemote?.logout();
                sessionStorage.removeItem('fleet_session');
                sessionStorage.removeItem('auth_token');
                sessionStorage.removeItem('auth_role');
                window.location.href = window.FleetRemote?.loginURL()||'index.html';
            };

            function goToMainLogin() {
                window.location.href = window.FleetRemote?.loginURL()||'index.html';
            }

            function loadSchedulerView() {
                requireSchedulerRole();
                initSchedulerView();
            }

            window.addEventListener('storage', event => {
                if (!event.key || event.key.startsWith('smart_fleet_') || event.key === 'sfos_multi_v2') {
                    initSchedulerView();
                    document.getElementById('auto-assignment-result').style.display = 'none';
                    document.getElementById('final-assign-btn').disabled = true;
                    showAlert('scheduler','success','Bus availability changed. Choose the trip and bus again.');
                }
            });
            window.addEventListener('fleet-db-updated', event => {
                if(event.detail?.stage==='remote'){
                    initSchedulerView();
                    document.getElementById('auto-assignment-result').style.display='none';
                    document.getElementById('final-assign-btn').disabled=true;
                }
            });
            // --- SCHEDULER LOGIC ---
            function initSchedulerView() {
                requireSchedulerRole();
                const depotLabel=document.getElementById('scheduler-depot-label');if(depotLabel)depotLabel.textContent=`${activeDepotName()} · Route & Driver Assignment`;
                const readyPool = window.FleetDB.Scheduler.getReadyPool(ACTIVE_DEPOT_ID);
                document.getElementById('pool-count').innerText = readyPool.length;

                const scheduleSelect = document.getElementById('scheduler-route-select');
                scheduleSelect.innerHTML = '<option value="">-- Choose Schedule (Route) --</option>';

                const assignments = window.FleetDB.Scheduler.getAssignments();
                const assignedScheduleIds = assignments.map(b => b.scheduleAssigned).filter(Boolean);

                // Compute allowed categories and time slots for schedules if needed
                window.SCHEDULES.forEach(sch => {
                    const routeInfo = window.ROUTES.find(r => r.id === sch.route);
                    const routeDiff = routeInfo ? routeInfo.category : 'Moderate';
                    const [h, m] = (sch.departure || "00:00").split(':').map(Number);
                    const mins = (h || 0) * 60 + (m || 0);

                    let ts = 'Peak';
                    if (mins < 420) ts = 'Normal';
                    else if (mins >= 420 && mins < 600) ts = 'Extreme Peak';
                    else if (mins >= 960 && mins < 1200) ts = 'Extreme Peak';

                    if (!sch.allowedCats || sch.allowedCats.length === 0) {
                        if (routeDiff === 'Complex') sch.allowedCats = ['A'];
                        else if (routeDiff === 'Simple' && ts === 'Normal') sch.allowedCats = ['A', 'B', 'C'];
                        else sch.allowedCats = ['A', 'B'];
                    }
                });

                // Populate route dropdown with unassigned schedules
                const availableSchedules = window.SCHEDULES.filter(s => !assignedScheduleIds.includes(s.id));
                availableSchedules.forEach(sch => {
                    const routeObj = window.ROUTES.find(r => r.id === sch.route);
                    const routeName = routeObj ? routeObj.name : sch.route;
                    const opt = document.createElement('option');
                    opt.value = sanitizeInput(sch.id);
                    opt.text = `${sch.id} | Route ${sch.route} (${routeName}) | Req: ${sch.singleChargeReq}km | Cat: ${sch.allowedCats.join(', ')} | Driver: ${sch.driverReq || 'Standard'}`;
                    scheduleSelect.appendChild(opt);
                });

                // Reset bus and driver select boxes
                const busSelect = document.getElementById('scheduler-bus-select');
                busSelect.innerHTML = '<option value="">-- Select a route first --</option>';

                const driverSelect = document.getElementById('scheduler-driver-select');
                driverSelect.innerHTML = '<option value="">-- Select a route first --</option>';

            }

            window.onScheduleSelected = function () {
                requireSchedulerRole();
                clearAlerts();
                evaluateBestBus();
            };

            window.evaluateBestBus = function () {
                requireSchedulerRole();
                const scheduleSelect = document.getElementById('scheduler-route-select');
                const scheduleId = sanitizeInput(scheduleSelect.value);
                const resultBox = document.getElementById('auto-assignment-result');
                const assignBtn = document.getElementById('final-assign-btn');
                const busSelect = document.getElementById('scheduler-bus-select');
                const driverSelect = document.getElementById('scheduler-driver-select');

                if (!scheduleId) {
                    resultBox.style.display = 'none';
                    assignBtn.disabled = true;
                    busSelect.innerHTML = '<option value="">-- Select a route first --</option>';
                    driverSelect.innerHTML = '<option value="">-- Select a route first --</option>';
                    window.currentBestBusId = null;
                    return;
                }

                // Call automatic assignment engine in FleetDB
                const rec = window.FleetDB.Scheduler.recommendAssignment(scheduleId, {
                    schedules: window.SCHEDULES,
                    fleet: window.FLEET,
                    routes: window.ROUTES,
                    depotId: ACTIVE_DEPOT_ID
                });

                if (!rec.success) {
                    resultBox.style.display = 'block';
                    assignBtn.disabled = true;
                    window.currentBestBusId = null;

                    let errorIcon = '&#9888;';
                    let errorTitle = 'Assignment Cannot Be Completed';
                    if (rec.errorType === 'NO_BUS') {
                        errorTitle = 'No Suitable Bus Available';
                        busSelect.innerHTML = '<option value="">-- No Eligible Bus Available --</option>';
                    } else if (rec.errorType === 'NO_DRIVER') {
                        errorTitle = 'No Eligible Driver Available';
                        if (rec.bus) {
                            busSelect.innerHTML = `<option value="${sanitizeInput(rec.bus.busId)}" selected>Bus ${sanitizeInput(rec.bus.busId)} (${sanitizeInput(rec.bus.regNo)})</option>`;
                        }
                        driverSelect.innerHTML = '<option value="">-- No Eligible Driver Available --</option>';
                    }

                    resultBox.innerHTML = `
                        <div style="color:var(--status-error); font-weight:700; font-size:1.05rem; margin-bottom:0.35rem;">
                            ${errorIcon} ${errorTitle}
                        </div>
                        <div style="font-size:0.9rem; color:var(--text-secondary); line-height:1.4;">
                            ${sanitizeInput(rec.reason)}
                        </div>
                    `;
                    return;
                }

                // Candidates are already filtered and sorted by FleetDB using this route's
                // category priority, range feasibility, ready status, depot scope, and conflicts.
                const bestBus = rec.bus;
                const candidates = Array.isArray(rec.busCandidates) && rec.busCandidates.length
                    ? rec.busCandidates.slice(0, 3)
                    : [bestBus];
                const bestDriver = rec.driver;
                const schedule = rec.schedule;
                window.currentBestBusId = null;

                busSelect.innerHTML = '<option value="">-- Choose one of the top 3 buses --</option>';
                candidates.forEach((bus, index) => {
                    const busId = bus.busId || bus.id;
                    const bufferKm = Number((Number(bus.actualRange) - Number(schedule.singleChargeReq || 0)).toFixed(1));
                    const opt = document.createElement('option');
                    opt.value = sanitizeInput(busId);
                    opt.textContent = `${index + 1}. Bus ${busId} (${bus.regNo || bus.reg || 'N/A'}) · Cat ${bus.cat} · ${bus.actualRange} km range · +${bufferKm} km reserve`;
                    busSelect.appendChild(opt);
                });
                busSelect.value = '';

                driverSelect.innerHTML = '';
                const driverOpt = document.createElement('option');
                driverOpt.value = sanitizeInput(bestDriver);
                driverOpt.text = `${bestDriver} (Recommended)`;
                driverOpt.selected = true;
                driverSelect.appendChild(driverOpt);

                const allDrivers = Array.from(new Set(window.FLEET.map(b => b.driver).filter(Boolean))).sort();
                const assignedDrivers = window.FleetDB.Scheduler.getAssignments().map(b => b.assignedDriver).filter(Boolean);
                allDrivers.forEach(d => {
                    if (d !== bestDriver && !assignedDrivers.includes(d) && window.FleetDB.isDriverEligible(d, schedule)) {
                        const opt = document.createElement('option');
                        opt.value = sanitizeInput(d);
                        opt.textContent = d;
                        driverSelect.appendChild(opt);
                    }
                });

                const candidateRows = candidates.map((bus, index) => {
                    const busId = bus.busId || bus.id;
                    const bufferKm = Number((Number(bus.actualRange) - Number(schedule.singleChargeReq || 0)).toFixed(1));
                    return `<div style="padding:.65rem .75rem; border:1px solid var(--border-card); border-radius:6px; background:var(--bg-surface);">
                        <strong>#${index + 1} · Bus ${sanitizeInput(busId)} (${sanitizeInput(bus.regNo || bus.reg || 'N/A')})</strong>
                        <span class="tag cat-${sanitizeInput(String(bus.cat || 'B').toLowerCase())}">Category ${sanitizeInput(bus.cat || 'N/A')}</span>
                        <span>${sanitizeInput(bus.actualRange)} km range · +${bufferKm} km route reserve</span>
                    </div>`;
                }).join('');

                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    <div style="font-weight:700; margin-bottom:.4rem; color:var(--text-bright);">Top ${candidates.length} buses for this route</div>
                    <div style="font-size:.85rem; color:var(--text-secondary); margin-bottom:.75rem;">Ranked by existing fleet rules: category priority, then the smallest range reserve that meets the route requirement. Each option is ready, route-compatible, and conflict-checked.</div>
                    <div style="display:grid; gap:.5rem;">${candidateRows}</div>
                    <div style="font-size:.9rem; color:var(--text-secondary); margin-top:.75rem;">Choose a bus below. Nothing is assigned until you press Confirm &amp; Save Assignment.</div>
                `;
                assignBtn.disabled = true;
            };
            window.onManualResourceChanged = function () {
                requireSchedulerRole();
                const busSelect = document.getElementById('scheduler-bus-select');
                const driverSelect = document.getElementById('scheduler-driver-select');
                const scheduleSelect = document.getElementById('scheduler-route-select');
                const assignBtn = document.getElementById('final-assign-btn');
                window.currentBestBusId = busSelect.value ? sanitizeInput(busSelect.value) : null;
                assignBtn.disabled = !(scheduleSelect.value && busSelect.value && driverSelect.value);
            };
            window.finalizeAssignment = async function () {
                requireSchedulerRole();
                const scheduleId = sanitizeInput(document.getElementById('scheduler-route-select').value);
                const busId = sanitizeInput(document.getElementById('scheduler-bus-select').value);
                const driverName = sanitizeInput(document.getElementById('scheduler-driver-select').value);

                if (!scheduleId || !driverName || !busId) {
                    showAlert('scheduler', 'error', 'Please ensure a route, bus, and driver are selected before confirming.');
                    return;
                }

                try {
                    // Assign bus using atomic pre-commit validation in SchedulerDB
                    if(window.FleetRemote?.enabled)await FleetRemote.perform('assign',{busId,scheduleId,driverName});
                    else window.FleetDB.Scheduler.assignBus(busId, scheduleId, driverName, {
                        schedules: window.SCHEDULES,
                        fleet: window.FLEET,
                        depotId: ACTIVE_DEPOT_ID
                    });

                    // Update local workflow state
                    if (localWorkflowState[busId]) {
                        localWorkflowState[busId].scheduleAssigned = scheduleId;
                        localWorkflowState[busId].assignedDriver = driverName;
                        saveState();
                    }

                    // Update memory schedule state
                    const sch = window.SCHEDULES.find(s => s.id === scheduleId);
                    if (sch) {
                        sch.assignedBus = busId;
                        sch.assignedDriver = driverName;
                        sch.status = 'Assigned';
                    }

                    showAlert('scheduler', 'success', `Confirmed! Bus ${busId} and Driver ${driverName} successfully assigned to Schedule ${scheduleId}.`);

                    document.getElementById('auto-assignment-result').style.display = 'none';
                    document.getElementById('final-assign-btn').disabled = true;
                    window.currentBestBusId = null;

                    initSchedulerView(); // Refresh route dropdown and ready pool count
                } catch (e) {
                    showAlert('scheduler', 'error', 'Assignment failed: ' + e.message);
                }
            };

            window.unassignAssignment = function (busId) {
                requireSchedulerRole();
                if (!busId) return;

                try {
                    window.FleetDB.Scheduler.unassignBus(busId);

                    if (localWorkflowState[busId]) {
                        localWorkflowState[busId].scheduleAssigned = null;
                        localWorkflowState[busId].assignedDriver = null;
                        saveState();
                    }

                    showAlert('scheduler', 'success', `Bus ${busId} has been unassigned and returned to the ready pool.`);
                    initSchedulerView();
                } catch (e) {
                    showAlert('scheduler', 'error', 'Error unassigning bus: ' + e.message);
                }
            };
        };
    </script>

</body>

</html>
